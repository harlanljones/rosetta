name: refresh-data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,web]"
      - name: Fetch live snapshots
        run: |
          rosetta fetch-chadwick
          rosetta fetch-statsapi --seasons 2024,2025 --sport 11 --league-label AAA
          rosetta fetch-statsapi --seasons 2024,2025 --sport 1 --league-label MLB
          rosetta fetch-kbo --seasons 2024,2025 --no-with-ages
          rosetta fetch-npb --seasons 2024,2025 --no-with-ages
          rosetta fetch-cpbl --seasons 2024
          rosetta generate-transfers
          rm -f data/outputs/factors.json
          make factors
          make leaderboard
      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: rosetta-snapshots
          path: |
            data/snapshots/*.csv
            data/outputs/leaderboard.json
