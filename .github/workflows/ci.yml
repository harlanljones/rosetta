name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,web]"
      - name: Lint
        run: python -m ruff check src tests apps
      - name: Test
        run: python -m pytest -q
      - name: Backtest
        run: make backtest
