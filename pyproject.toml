[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rosetta-mle"
version = "0.1.0"
description = "Major League Equivalency engine — translate NPB/KBO/AAA performance to MLB scale"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Rosetta" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "korean-romanizer>=1.1",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "jinja2>=3.1", "python-multipart>=0.0.9"]
scrape = ["pybaseball>=2.2", "requests>=2.31", "beautifulsoup4>=4.12", "lxml>=5.0"]
dev = ["pytest>=8.0", "ruff>=0.3", "httpx>=0.27"]

[project.scripts]
rosetta = "rosetta.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rosetta"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
